name: SignalK Plugin CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Nothing by default; the job grants what the upstream workflow needs.
permissions: {}

jobs:
  test:
    permissions:
      contents: read
    # SignalK's shared plugin CI, pinned to a commit of master, where it is maintained
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@a99f838a61bdbe8806e3b181aa62bb0cae353ec2
    with:
      coverage-command: npm run test:coverage
      format-check-command: npm run fmt:check

  # The upstream "CI Status" job only fails on an explicit `failure`, so a
  # matrix job that was cancelled (e.g. never got a runner) still reads as
  # passing. This gate is green only when every planned job succeeded.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs: test
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null \
            || { echo "::error::Not all CI jobs succeeded"; exit 1; }
